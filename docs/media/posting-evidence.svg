<title id="title">Actual synthetic credit, journal, and period close</title><desc id="desc">Selected values from a PostgreSQL-backed HTTP test. Credit posted for 16.67, with matching debit and credit. Stock remaining is zero. Fiscal close returned 200 and the stored state is Closed.</desc>
