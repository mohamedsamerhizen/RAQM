<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="481" viewBox="0 0 1000 481" role="img" aria-labelledby="title desc">
<title id="title">RAQM system architecture</title><desc id="desc">HTTP requests enter the modular monolith through company access checks. The workflow coordinates writes to PostgreSQL, and a hosted worker reads persisted delivery work.</desc>
<rect x="0" y="0" width="1000" height="481" fill="#f3efe4" stroke="none" rx="0"/>
<g font-family="system-ui, Segoe UI, Arial, sans-serif"><text x="49" y="60" font-size="22" font-weight="700" fill="#006854" font-family="Consolas, monospace" letter-spacing="1.3">01 / ARCHITECTURE</text><text x="47" y="120" font-size="56" font-weight="400" fill="#101c28" font-family="Georgia, serif">Inside the modular monolith</text><rect x="51" y="153" width="897" height="103" fill="#dde7dc" stroke="none" rx="0"/><path d="M322 168V242M612 168V242" fill="none" stroke="#9aaea4" stroke-width="1.5" /><text x="77" y="215" font-size="40" font-weight="600" fill="#101c28">HTTP API</text><text x="349" y="215" font-size="32" font-weight="600" fill="#101c28">Company access</text><text x="642" y="215" font-size="32" font-weight="600" fill="#101c28">Domain services</text><path d="M180 256V284H816V256M500 284V314" fill="none" stroke="#006854" stroke-width="3" /><rect x="52" y="315" width="594" height="112" fill="#101c28" stroke="none" rx="0"/><text x="78" y="365" font-size="43" font-weight="600" fill="#f7f5ed">PostgreSQL 17</text><text x="80" y="402" font-size="28" font-weight="600" fill="#b4f2d5">Source records · ledger · outbox</text><path d="M646 370H721" fill="none" stroke="#006854" stroke-width="4" /><circle cx="721" cy="370" r="7" fill="#006854"/><text x="738" y="359" font-size="40" font-weight="600" fill="#101c28">Worker</text><text x="739" y="398" font-size="27" font-weight="600" fill="#445c5b">Lease &amp; retry</text><text x="52" y="463" font-size="25" font-weight="600" fill="#445c5b">EF Core coordinates relational writes.</text></g>
