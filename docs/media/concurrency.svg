<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="403" viewBox="0 0 1000 403" role="img" aria-labelledby="title desc">
<title id="title">Concurrent credit and shipment</title><desc id="desc">One illustrated ordering. Credit takes the company lock and commits. The waiting shipment rechecks quantity and returns HTTP 409. A matching retry reuses the existing journal.</desc>
<rect x="0" y="0" width="1000" height="403" fill="#111e2c" stroke="none" rx="0"/>
<g font-family="system-ui, Segoe UI, Arial, sans-serif"><text x="49" y="56" font-size="22" font-weight="700" fill="#b4f2d5" font-family="Consolas, monospace" letter-spacing="1.3">03 / CONCURRENCY</text><text x="46" y="118" font-size="55" font-weight="400" fill="#f7f5ed" font-family="Georgia, serif">One outcome commits</text><rect x="421" y="148" width="260" height="182" fill="#22394a" stroke="none" rx="0"/><text x="441" y="180" font-size="22" font-weight="700" fill="#b4f2d5" font-family="Consolas, monospace" letter-spacing="1.3">COMPANY LOCK</text><text x="45" y="229" font-size="34" font-weight="600" fill="#f7f5ed">Credit</text><text x="45" y="315" font-size="34" font-weight="600" fill="#f7f5ed">Shipment</text><path d="M236 220H680" fill="none" stroke="#b4f2d5" stroke-width="5" /><path d="M236 307H421" fill="none" stroke="#efc783" stroke-width="4" /><path d="M421 307H680" fill="none" stroke="#efc783" stroke-width="3" stroke-dasharray="9 9"/><path d="M680 307H945" fill="none" stroke="#efc783" stroke-width="4" /><circle cx="236" cy="220" r="7" fill="#b4f2d5"/><circle cx="421" cy="220" r="7" fill="#b4f2d5"/><circle cx="680" cy="220" r="7" fill="#b4f2d5"/><circle cx="236" cy="307" r="7" fill="#efc783"/><circle cx="421" cy="307" r="7" fill="#efc783"/><circle cx="680" cy="307" r="7" fill="#efc783"/><circle cx="945" cy="307" r="7" fill="#efc783"/><text x="700" y="230" font-size="34" font-weight="600" fill="#b4f2d5">Commit</text><text x="450" y="289" font-size="29" font-weight="600" fill="#efc783">Wait</text><text x="701" y="287" font-size="32" font-weight="600" fill="#efc783">Recheck → 409</text><text x="47" y="374" font-size="31" font-weight="600" fill="#f7f5ed">Matching credit retry → same journal</text></g>
</svg>
