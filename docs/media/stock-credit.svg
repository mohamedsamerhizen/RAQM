<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="641" viewBox="0 0 1000 641" role="img" aria-labelledby="title desc">
<title id="title">GATE-01 stock precision</title><desc id="desc">0.333333 times 1.5 produces 0.4999995. The original path stranded half a micro-unit and returned 409 at close. The corrected path rejects the invalid product and closes at zero after exact credit and shipment.</desc>
<rect x="0" y="0" width="1000" height="641" fill="#f3efe4" stroke="none" rx="0"/>
<g font-family="system-ui, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1000" height="328" fill="#101c28" stroke="none" rx="0"/><text x="45" y="55" font-size="23" font-weight="700" fill="#efc783" font-family="Consolas, monospace" letter-spacing="1.3">GATE-01 / STOCK PRECISION</text><text x="45" y="122" font-size="65" font-weight="400" fill="#f7f5ed" font-family="Georgia, serif">Half a micro-unit</text><text x="45" y="186" font-size="47" font-weight="740" fill="#efc783">0.333333 × 1.5 = 0.4999995</text><path d="M57 235H943" fill="none" stroke="#68818c" stroke-width="2" /><path d="M131 220V252M501 214V256M870 220V252" fill="none" stroke="#9eb6bb" stroke-width="2" /><circle cx="501" cy="235" r="8" fill="#efc783"/><text x="118" y="284" font-size="25" font-weight="600" fill="#f7f5ed">0.499999</text><text x="445" y="284" font-size="28" font-weight="600" fill="#efc783">halfway</text><text x="807" y="284" font-size="25" font-weight="600" fill="#f7f5ed">0.500000</text><text x="44" y="374" font-size="24" font-weight="700" fill="#943c28" font-family="Consolas, monospace" letter-spacing="1.3">BEFORE</text><text x="45" y="426" font-size="42" font-weight="600" fill="#943c28">0.0000005 left</text><text x="46" y="467" font-size="29" font-weight="600" fill="#445c5b">HTTP 409 at close</text><path d="M437 352V498" fill="none" stroke="#9aaea4" stroke-width="1.5" /><text x="468" y="374" font-size="24" font-weight="700" fill="#006854" font-family="Consolas, monospace" letter-spacing="1.3">AFTER</text><text x="469" y="422" font-size="40" font-weight="740" fill="#006854">0.500001 + 2.499999</text><text x="469" y="466" font-size="27" font-weight="600" fill="#445c5b">Exact credit + issue · close succeeds</text><path d="M44 510H955" fill="none" stroke="#9aaea4" stroke-width="1.5" /><text x="45" y="558" font-size="31" font-weight="600" fill="#101c28">API + PostgreSQL reject the seven-decimal product.</text><text x="46" y="605" font-size="32" font-weight="740" fill="#006854">$16.67 credit  /  $50 COGS  /  $10 inventory</text></g>
</svg>
