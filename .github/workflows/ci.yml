name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore RAQM.slnx
      - run: dotnet tool restore
      - run: dotnet build RAQM.slnx -c Release --no-restore
      - run: dotnet ef migrations has-pending-model-changes --project RAQM.Api --configuration Release --no-build
      # Hosted Ubuntu has Docker. Testcontainers starts a fresh PostgreSQL and applies migrations.
      - run: dotnet test RAQM.slnx -c Release --no-build

